<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantin Yönetim Sistemi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0e0d;
    --surface: #1a1917;
    --card: #222120;
    --border: #333230;
    --accent: #f5a623;
    --accent2: #e8453c;
    --green: #2ecc71;
    --text: #f0ede8;
    --muted: #7a7570;
    --font: 'Syne', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-date { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* NAV */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 24px;
    gap: 4px;
    overflow-x: auto;
  }
  .nav-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 14px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PAGES */
  .page { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
  .page.active { display: block; }

  /* CARDS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 800; }
  .stat-value.gold { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--accent2); }

  /* SCANNER */
  .scanner-area {
    background: #000;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4/3;
    max-width: 480px;
    margin: 0 auto 20px;
  }
  #video { width: 100%; height: 100%; object-fit: cover; }
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 200px;
    height: 200px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{border-color:var(--accent)} 50%{border-color:rgba(245,166,35,0.4)} }

  .scan-line {
    position: absolute;
    width: 180px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 2s infinite;
  }
  @keyframes scan { 0%{top:calc(50% - 90px)} 50%{top:calc(50% + 90px)} 100%{top:calc(50% - 90px)} }

  /* BUTTONS */
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #ffc04d; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--border); }
  .btn.danger { background: var(--accent2); color: #fff; }
  .btn.danger:hover { background: #ff6b6b; }
  .btn.green { background: var(--green); color: #000; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* FORMS */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; font-weight: 600; color: var(--muted); }
  input, select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-ok { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-low { background: rgba(245,166,35,0.15); color: var(--accent); }
  .badge-out { background: rgba(232,69,60,0.15); color: var(--accent2); }

  /* CART */
  .cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border: none; }
  .cart-item-name { font-weight: 600; }
  .cart-item-price { font-family: var(--mono); color: var(--accent); }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--accent);
  }
  .cart-total-label { font-size: 16px; font-weight: 700; }
  .cart-total-amount { font-size: 28px; font-weight: 800; color: var(--accent); font-family: var(--mono); }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green);
    color: #000;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.error { background: var(--accent2); color: #fff; }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
  }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }

  /* SCAN INPUT */
  .scan-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: flex-end;
  }
  .scan-input-row .form-group { flex: 1; }

  /* REPORT */
  .report-section { margin-bottom: 24px; }
  .report-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .report-row:last-child { border: none; }
  .report-total { display: flex; justify-content: space-between; padding: 14px 0; font-size: 18px; font-weight: 800; border-top: 2px solid var(--accent); margin-top: 8px; }
  .report-total span:last-child { color: var(--accent); }

  /* BARCODE GEN */
  .barcode-preview { background: #fff; padding: 16px; border-radius: 8px; text-align: center; margin-top: 12px; }
  .barcode-preview svg { max-width: 100%; }

  /* DIVIDER */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .page { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    header { padding: 0 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Kantin<span>.</span></div>
  <div class="header-date" id="headerDate"></div>
</header>

<nav>
  <button class="nav-btn active" onclick="goPage('satis')">🛒 Satış</button>
  <button class="nav-btn" onclick="goPage('urunler')">📦 Ürünler</button>
  <button class="nav-btn" onclick="goPage('rapor')">📊 Rapor</button>
  <button class="nav-btn" onclick="goPage('barkod')">🏷️ Barkod Üret</button>
</nav>

<!-- ============ SATIŞ ============ -->
<div id="satis" class="page active">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start">
    <div>
      <!-- KAMERA TARAMA -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">📷 Kamera ile Tara</div>
        <div class="scanner-area">
          <video id="video" autoplay muted playsinline></video>
          <div class="scan-overlay">
            <div class="scan-frame"><div class="scan-line"></div></div>
          </div>
        </div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn" id="startCamBtn" onclick="startCamera()">Kamerayı Aç</button>
          <button class="btn secondary" id="stopCamBtn" onclick="stopCamera()" style="display:none">Kamerayı Kapat</button>
        </div>
      </div>

      <!-- MANUEL GİRİŞ -->
      <div class="card">
        <div class="card-title">⌨️ Manuel Barkod / İsim ile Ara</div>
        <div class="scan-input-row">
          <div class="form-group">
            <label>Barkod veya Ürün Adı</label>
            <input id="manualInput" type="text" placeholder="Barkod gir veya ürün adı yaz..." onkeydown="if(event.key==='Enter')manualScan()">
          </div>
          <button class="btn" onclick="manualScan()">Ekle</button>
        </div>
        <!-- Arama sonuçları -->
        <div id="searchResults" style="display:none"></div>
      </div>
    </div>

    <!-- SEPET -->
    <div class="card" style="position:sticky;top:90px">
      <div class="card-title">🧾 Sepet</div>
      <div id="cartItems" style="min-height:80px"></div>
      <div class="cart-total">
        <span class="cart-total-label">TOPLAM</span>
        <span class="cart-total-amount" id="cartTotal">₺0.00</span>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn green" style="flex:1" onclick="completeSale()">✓ Satışı Tamamla</button>
        <button class="btn danger" onclick="clearCart()">Temizle</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ ÜRÜNLER ============ -->
<div id="urunler" class="page">
  <div class="card" style="margin-bottom:20px">
    <div class="card-title">➕ Yeni Ürün Ekle</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Ürün Adı *</label>
        <input id="pName" type="text" placeholder="Örn: Su 0.5L">
      </div>
      <div class="form-group">
        <label>Barkod *</label>
        <input id="pBarcode" type="text" placeholder="Örn: 8690123456789">
      </div>
      <div class="form-group">
        <label>Fiyat (₺) *</label>
        <input id="pPrice" type="number" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Stok Adedi *</label>
        <input id="pStock" type="number" placeholder="0">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="pCategory">
          <option>İçecek</option>
          <option>Atıştırmalık</option>
          <option>Sıcak İçecek</option>
          <option>Yiyecek</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Düşük Stok Uyarısı</label>
        <input id="pMinStock" type="number" placeholder="5" value="5">
      </div>
    </div>
    <div style="margin-top:14px">
      <button class="btn" onclick="addProduct()">Ürün Ekle</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>📦 Ürün Listesi</span>
      <input id="productSearch" type="text" placeholder="Ara..." style="width:180px;padding:6px 10px;font-size:13px" oninput="renderProducts()">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ürün</th>
            <th>Barkod</th>
            <th>Fiyat</th>
            <th>Stok</th>
            <th>Durum</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============ RAPOR ============ -->
<div id="rapor" class="page">
  <div class="stats-grid" id="reportStats"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px" class="report-cols">
    <div class="card">
      <div class="card-title">📅 Dönem Seç</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Başlangıç</label>
          <input type="date" id="reportStart">
        </div>
        <div class="form-group">
          <label>Bitiş</label>
          <input type="date" id="reportEnd">
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn secondary" onclick="setReportPeriod('today')">Bugün</button>
        <button class="btn secondary" onclick="setReportPeriod('week')">Bu Hafta</button>
        <button class="btn secondary" onclick="setReportPeriod('month')">Bu Ay</button>
        <button class="btn" onclick="generateReport()">Raporu Göster</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚠️ Düşük Stok Uyarıları</div>
      <div id="lowStockList"></div>
    </div>
  </div>

  <div class="card" id="reportCard" style="display:none">
    <div class="card-title">📊 Rapor Sonuçları</div>
    <div id="reportContent"></div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="card-title">🕓 Son Satışlar</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Tarih/Saat</th><th>Ürünler</th><th>Tutar</th></tr>
        </thead>
        <tbody id="salesTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============ BARKOD ÜRET ============ -->
<div id="barkod" class="page">
  <div class="card" style="max-width:500px;margin:0 auto">
    <div class="card-title">🏷️ Barkod / QR Etiket Üret</div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Ürün Seç (veya barkod gir)</label>
      <select id="barcodeProduct" onchange="fillBarcodeFromProduct()">
        <option value="">— Ürün seç —</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Barkod Numarası</label>
      <input id="barcodeValue" type="text" placeholder="8690123456789">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Etiket Metni</label>
      <input id="barcodeLabel" type="text" placeholder="Ürün adı">
    </div>
    <div class="form-group" style="margin-bottom:16px">
      <label>Format</label>
      <select id="barcodeFormat">
        <option value="CODE128">CODE128 (Genel)</option>
        <option value="EAN13">EAN-13</option>
        <option value="EAN8">EAN-8</option>
        <option value="UPC">UPC-A</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="generateBarcode()">Barkod Üret</button>
      <button class="btn secondary" onclick="printBarcode()">🖨️ Yazdır</button>
    </div>
    <div id="barcodePreview" style="display:none" class="barcode-preview">
      <svg id="barcodeSVG"></svg>
      <div id="barcodeText" style="margin-top:8px;font-size:13px;color:#333;font-weight:600"></div>
    </div>
  </div>
</div>

<!-- MODAL: Ürün Güncelle -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <div class="modal-title">✏️ Ürün Güncelle</div>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="form-group">
        <label>Ürün Adı</label>
        <input id="editName" type="text">
      </div>
      <div class="form-group">
        <label>Fiyat (₺)</label>
        <input id="editPrice" type="number" step="0.01">
      </div>
      <div class="form-group">
        <label>Stok</label>
        <input id="editStock" type="number">
      </div>
      <div class="form-group">
        <label>Min. Stok</label>
        <input id="editMin" type="number">
      </div>
    </div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn" onclick="saveEdit()">Kaydet</button>
      <button class="btn secondary" onclick="closeModal()">İptal</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== VERİ ==========
let products = JSON.parse(localStorage.getItem('kantin_products') || '[]');
let sales = JSON.parse(localStorage.getItem('kantin_sales') || '[]');
let cart = [];

function saveData() {
  localStorage.setItem('kantin_products', JSON.stringify(products));
  localStorage.setItem('kantin_sales', JSON.stringify(sales));
}

// ========== SAYFA NAV ==========
function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  stopCamera();
  if (id === 'urunler') renderProducts();
  if (id === 'rapor') { renderReport(); renderSalesTable(); renderLowStock(); }
  if (id === 'barkod') fillBarcodeSelect();
}

// ========== HEADER ==========
function updateDate() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
updateDate();

// ========== TOAST ==========
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'error' ? 'show error' : 'show';
  setTimeout(() => t.className = '', 2500);
}

// ========== KAMERA ==========
let stream = null;
let scanInterval = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    document.getElementById('video').srcObject = stream;
    document.getElementById('startCamBtn').style.display = 'none';
    document.getElementById('stopCamBtn').style.display = 'inline-block';

    // jsQR ile barkod tara
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    script.onload = startScanLoop;
    document.head.appendChild(script);
  } catch(e) {
    toast('Kamera erişimi reddedildi veya desteklenmiyor.', 'error');
  }
}

function startScanLoop() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  scanInterval = setInterval(() => {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (typeof jsQR === 'undefined') return;
    const code = jsQR(imgData.data, imgData.width, imgData.height);
    if (code) {
      addToCartByBarcode(code.data);
    }
  }, 800);
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  document.getElementById('video').srcObject = null;
  document.getElementById('startCamBtn').style.display = 'inline-block';
  document.getElementById('stopCamBtn').style.display = 'none';
}

// ========== BARKOD EKLEME ==========
function addToCartByBarcode(barcode) {
  const p = products.find(x => x.barcode === barcode.trim());
  if (!p) { toast('Barkod bulunamadı: ' + barcode, 'error'); return; }
  if (p.stock <= 0) { toast(p.name + ' stokta yok!', 'error'); return; }
  addToCart(p);
}

function manualScan() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;

  // Önce tam barkod eşleşmesi
  const byBarcode = products.find(x => x.barcode === val);
  if (byBarcode) { addToCartByBarcode(val); document.getElementById('manualInput').value = ''; return; }

  // İsimle ara
  const results = products.filter(x => x.name.toLowerCase().includes(val.toLowerCase()));
  const sr = document.getElementById('searchResults');
  if (results.length === 0) { toast('Ürün bulunamadı', 'error'); sr.style.display = 'none'; return; }
  if (results.length === 1) { addToCart(results[0]); document.getElementById('manualInput').value = ''; sr.style.display = 'none'; return; }

  sr.style.display = 'block';
  sr.innerHTML = results.map(p =>
    `<button class="btn secondary" style="margin:4px;font-size:13px" onclick="addToCart(products.find(x=>x.id==='${p.id}'));document.getElementById('searchResults').style.display='none';document.getElementById('manualInput').value=''">
      ${p.name} — ₺${p.price.toFixed(2)}
    </button>`
  ).join('');
}

function addToCart(p) {
  const existing = cart.find(x => x.id === p.id);
  if (existing) {
    if (existing.qty >= p.stock) { toast('Stok yetersiz!', 'error'); return; }
    existing.qty++;
  } else {
    cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
  }
  renderCart();
  toast(p.name + ' sepete eklendi ✓');
}

function removeFromCart(id) {
  cart = cart.filter(x => x.id !== id);
  renderCart();
}

function clearCart() { cart = []; renderCart(); }

function renderCart() {
  const el = document.getElementById('cartItems');
  if (cart.length === 0) {
    el.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:20px 0;text-align:center">Sepet boş</div>';
    document.getElementById('cartTotal').textContent = '₺0.00';
    return;
  }
  let total = 0;
  el.innerHTML = cart.map(item => {
    const sub = item.price * item.qty;
    total += sub;
    return `<div class="cart-item">
      <div>
        <div class="cart-item-name">${item.name}</div>
        <div style="font-size:12px;color:var(--muted)">${item.qty} × ₺${item.price.toFixed(2)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="cart-item-price">₺${sub.toFixed(2)}</span>
        <button onclick="removeFromCart('${item.id}')" style="background:none;border:none;color:var(--accent2);cursor:pointer;font-size:16px">✕</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').textContent = '₺' + total.toFixed(2);
}

function completeSale() {
  if (cart.length === 0) { toast('Sepet boş!', 'error'); return; }
  const total = cart.reduce((s, x) => s + x.price * x.qty, 0);

  // Stok düş
  cart.forEach(item => {
    const p = products.find(x => x.id === item.id);
    if (p) p.stock -= item.qty;
  });

  // Satış kaydet
  sales.push({
    id: Date.now().toString(),
    date: new Date().toISOString(),
    items: cart.map(x => ({...x})),
    total
  });

  saveData();
  cart = [];
  renderCart();
  toast(`✓ Satış tamamlandı! ₺${total.toFixed(2)}`);
}

// ========== ÜRÜNLER ==========
function addProduct() {
  const name = document.getElementById('pName').value.trim();
  const barcode = document.getElementById('pBarcode').value.trim();
  const price = parseFloat(document.getElementById('pPrice').value);
  const stock = parseInt(document.getElementById('pStock').value);
  const category = document.getElementById('pCategory').value;
  const minStock = parseInt(document.getElementById('pMinStock').value) || 5;

  if (!name || !barcode || isNaN(price) || isNaN(stock)) { toast('Tüm zorunlu alanları doldurun!', 'error'); return; }
  if (products.find(x => x.barcode === barcode)) { toast('Bu barkod zaten kayıtlı!', 'error'); return; }

  products.push({ id: Date.now().toString(), name, barcode, price, stock, category, minStock });
  saveData();
  ['pName','pBarcode','pPrice','pStock'].forEach(id => document.getElementById(id).value = '');
  renderProducts();
  toast(name + ' eklendi ✓');
}

function renderProducts() {
  const q = (document.getElementById('productSearch')?.value || '').toLowerCase();
  const filtered = products.filter(p =>
    p.name.toLowerCase().includes(q) || p.barcode.includes(q)
  );
  const tb = document.getElementById('productTable');
  if (!tb) return;
  if (filtered.length === 0) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">Ürün bulunamadı</td></tr>'; return; }
  tb.innerHTML = filtered.map(p => {
    let badge = p.stock <= 0
      ? '<span class="badge badge-out">Tükendi</span>'
      : p.stock <= p.minStock
        ? '<span class="badge badge-low">Düşük</span>'
        : '<span class="badge badge-ok">Yeterli</span>';
    return `<tr>
      <td><div style="font-weight:600">${p.name}</div><div style="font-size:12px;color:var(--muted)">${p.category}</div></td>
      <td style="font-family:var(--mono);font-size:13px">${p.barcode}</td>
      <td style="font-weight:700;color:var(--accent)">₺${p.price.toFixed(2)}</td>
      <td style="font-weight:700">${p.stock}</td>
      <td>${badge}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn secondary" style="padding:5px 10px;font-size:12px" onclick="openEdit('${p.id}')">Düzenle</button>
          <button class="btn danger" style="padding:5px 10px;font-size:12px" onclick="deleteProduct('${p.id}')">Sil</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function deleteProduct(id) {
  if (!confirm('Ürünü silmek istediğinizden emin misiniz?')) return;
  products = products.filter(p => p.id !== id);
  saveData(); renderProducts(); toast('Ürün silindi');
}

function openEdit(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = p.name;
  document.getElementById('editPrice').value = p.price;
  document.getElementById('editStock').value = p.stock;
  document.getElementById('editMin').value = p.minStock;
  document.getElementById('editModal').classList.add('open');
}

function saveEdit() {
  const id = document.getElementById('editId').value;
  const p = products.find(x => x.id === id);
  if (!p) return;
  p.name = document.getElementById('editName').value;
  p.price = parseFloat(document.getElementById('editPrice').value);
  p.stock = parseInt(document.getElementById('editStock').value);
  p.minStock = parseInt(document.getElementById('editMin').value);
  saveData(); renderProducts(); closeModal(); toast('Ürün güncellendi ✓');
}

function closeModal() { document.getElementById('editModal').classList.remove('open'); }

// ========== RAPOR ==========
function setReportPeriod(p) {
  const now = new Date();
  const start = document.getElementById('reportStart');
  const end = document.getElementById('reportEnd');
  end.value = now.toISOString().split('T')[0];
  if (p === 'today') start.value = now.toISOString().split('T')[0];
  else if (p === 'week') {
    const d = new Date(now); d.setDate(d.getDate() - 6);
    start.value = d.toISOString().split('T')[0];
  } else {
    start.value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  }
  generateReport();
}

function generateReport() {
  const start = document.getElementById('reportStart').value;
  const end = document.getElementById('reportEnd').value;
  if (!start || !end) { toast('Tarih aralığı seç', 'error'); return; }

  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T23:59:59');
  const filtered = sales.filter(x => { const d = new Date(x.date); return d >= s && d <= e; });

  const ciro = filtered.reduce((s, x) => s + x.total, 0);
  const satisAdet = filtered.reduce((s, x) => s + x.items.reduce((a, b) => a + b.qty, 0), 0);

  // Ürün bazlı
  const prodMap = {};
  filtered.forEach(sale => {
    sale.items.forEach(item => {
      if (!prodMap[item.name]) prodMap[item.name] = { qty: 0, total: 0 };
      prodMap[item.name].qty += item.qty;
      prodMap[item.name].total += item.price * item.qty;
    });
  });

  const sorted = Object.entries(prodMap).sort((a, b) => b[1].total - a[1].total);

  const card = document.getElementById('reportCard');
  card.style.display = 'block';
  document.getElementById('reportContent').innerHTML = `
    <div class="report-section">
      <div style="margin-bottom:12px;font-weight:700;font-size:15px">${start} → ${end} arası: ${filtered.length} işlem, ${satisAdet} ürün satıldı</div>
      <div class="report-section">
        ${sorted.map(([name, d]) =>
          `<div class="report-row"><span>${name}</span><span style="color:var(--muted)">${d.qty} adet — <b style="color:var(--accent)">₺${d.total.toFixed(2)}</b></span></div>`
        ).join('')}
        <div class="report-total"><span>TOPLAM CİRO</span><span>₺${ciro.toFixed(2)}</span></div>
      </div>
    </div>`;
}

function renderReport() {
  const totalCiro = sales.reduce((s, x) => s + x.total, 0);
  const todaySales = sales.filter(x => new Date(x.date).toDateString() === new Date().toDateString());
  const todayCiro = todaySales.reduce((s, x) => s + x.total, 0);
  const totalStockVal = products.reduce((s, p) => s + p.price * p.stock, 0);

  document.getElementById('reportStats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Bugünkü Ciro</div><div class="stat-value gold">₺${todayCiro.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam Ciro</div><div class="stat-value green">₺${totalCiro.toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam Satış</div><div class="stat-value">${sales.length}</div></div>
    <div class="stat-card"><div class="stat-label">Ürün Çeşidi</div><div class="stat-value">${products.length}</div></div>
    <div class="stat-card"><div class="stat-label">Stok Değeri</div><div class="stat-value gold">₺${totalStockVal.toFixed(2)}</div></div>
  `;

  // Varsayılan bu ay
  const now = new Date();
  if (!document.getElementById('reportStart').value) {
    document.getElementById('reportStart').value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('reportEnd').value = now.toISOString().split('T')[0];
    generateReport();
  }
}

function renderLowStock() {
  const low = products.filter(p => p.stock <= p.minStock);
  const el = document.getElementById('lowStockList');
  if (low.length === 0) { el.innerHTML = '<div style="color:var(--green);font-size:14px">✓ Tüm stoklar yeterli</div>'; return; }
  el.innerHTML = low.map(p =>
    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px">
      <span>${p.name}</span>
      <span style="color:${p.stock === 0 ? 'var(--accent2)' : 'var(--accent)'};font-weight:700">${p.stock} adet</span>
    </div>`
  ).join('');
}

function renderSalesTable() {
  const tb = document.getElementById('salesTable');
  const recent = [...sales].reverse().slice(0, 30);
  if (recent.length === 0) { tb.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px">Henüz satış yok</td></tr>'; return; }
  tb.innerHTML = recent.map(s => `<tr>
    <td style="font-family:var(--mono);font-size:13px">${new Date(s.date).toLocaleString('tr-TR')}</td>
    <td style="font-size:13px">${s.items.map(x => x.name + ' ×' + x.qty).join(', ')}</td>
    <td style="font-weight:700;color:var(--accent)">₺${s.total.toFixed(2)}</td>
  </tr>`).join('');
}

// ========== BARKOD ÜRET ==========
function fillBarcodeSelect() {
  const sel = document.getElementById('barcodeProduct');
  sel.innerHTML = '<option value="">— Ürün seç —</option>' +
    products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

function fillBarcodeFromProduct() {
  const id = document.getElementById('barcodeProduct').value;
  if (!id) return;
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('barcodeValue').value = p.barcode;
  document.getElementById('barcodeLabel').value = p.name;
}

function generateBarcode() {
  const val = document.getElementById('barcodeValue').value.trim();
  const label = document.getElementById('barcodeLabel').value.trim();
  const fmt = document.getElementById('barcodeFormat').value;
  if (!val) { toast('Barkod değeri girin', 'error'); return; }
  try {
    JsBarcode('#barcodeSVG', val, { format: fmt, displayValue: true, fontSize: 14, height: 70 });
    document.getElementById('barcodeText').textContent = label;
    document.getElementById('barcodePreview').style.display = 'block';
  } catch(e) { toast('Geçersiz barkod formatı: ' + e.message, 'error'); }
}

function printBarcode() {
  const preview = document.getElementById('barcodePreview');
  if (preview.style.display === 'none') { toast('Önce barkod üretin', 'error'); return; }
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="display:flex;justify-content:center;align-items:center;height:100vh">
    ${preview.innerHTML}</body></html>`);
  win.document.close();
  win.print();
}
